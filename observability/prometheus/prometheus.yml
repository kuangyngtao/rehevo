global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts/*.yml

scrape_configs:
  - job_name: rehevo-app
    metrics_path: /actuator/prometheus
    static_configs:
      # 后端在 Windows 宿主机运行；Docker Desktop 通过该名称访问宿主机。
      - targets: [host.docker.internal:8080]
